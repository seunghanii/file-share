<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="파일공유">
<title>파일공유</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --text:#1d1d1f; --muted:#6e6e73; --line:#e3e3e8; --accent:#0a6cff; --danger:#d93025; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111214; --card:#1c1d20; --text:#f2f2f5; --muted:#9a9aa1; --line:#2c2d31; --accent:#3d8bff; --danger:#ff6b5e; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif; }
  main { max-width:820px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:24px; margin:8px 0 18px; }
  .drop { background:var(--card); border:2px dashed var(--line); border-radius:16px; padding:28px 16px;
          text-align:center; transition:.15s; }
  .drop.over { border-color:var(--accent); background:color-mix(in srgb, var(--accent) 8%, var(--card)); }
  .drop p { margin:10px 0 0; color:var(--muted); font-size:14px; }
  .btn { display:inline-block; background:var(--accent); color:#fff; border:0; border-radius:12px;
         padding:14px 26px; font-size:17px; font-weight:600; cursor:pointer; }
  .uploads { margin-top:12px; }
  .up { background:var(--card); border-radius:12px; padding:10px 14px; margin-top:8px; font-size:14px; }
  .bar { height:6px; background:var(--line); border-radius:3px; margin-top:6px; overflow:hidden; }
  .bar > div { height:100%; width:0; background:var(--accent); transition:width .1s; }
  .head { display:flex; justify-content:space-between; align-items:center; margin:28px 0 8px; }
  .head h2 { font-size:18px; margin:0; }
  .link { background:none; border:0; color:var(--accent); font-size:15px; cursor:pointer; padding:8px; }
  ul { list-style:none; margin:0; padding:0; background:var(--card); border-radius:16px; overflow:hidden; }
  li { display:flex; align-items:center; gap:12px; padding:12px 14px; border-top:1px solid var(--line); }
  li:first-child { border-top:0; }
  .ico { width:42px; height:42px; border-radius:10px; flex:none; display:flex; align-items:center; justify-content:center;
         font-size:11px; font-weight:700; color:#fff; overflow:hidden; background:#8e8e93; }
  .ico img { width:100%; height:100%; object-fit:cover; display:block; }
  .ico.thumb { background:var(--line); }
  .info { flex:1; min-width:0; }
  .name { color:var(--text); text-decoration:none; font-size:15px; }
  .meta { color:var(--muted); font-size:12px; margin-top:2px; }
  .actions { display:flex; gap:6px; flex:none; }
  .actions a, .actions button { border:1px solid var(--line); background:transparent; color:var(--text);
         border-radius:10px; padding:9px 12px; font-size:14px; text-decoration:none; cursor:pointer; }
  .actions .del { color:var(--danger); }
  .note { background:var(--card); border-radius:16px; padding:14px; margin-top:12px; }
  .note textarea { width:100%; min-height:72px; border:1px solid var(--line); border-radius:10px; padding:10px;
         font:inherit; font-size:16px; background:transparent; color:var(--text); resize:vertical; }
  .note .row { display:flex; justify-content:space-between; align-items:center; margin-top:8px; gap:8px; }
  .note .row span { color:var(--muted); font-size:13px; }
  .note button { background:var(--accent); color:#fff; border:0; border-radius:10px; padding:10px 18px; font-size:15px; font-weight:600; }
  .preview { color:var(--text); font-size:13px; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .actions .copy { color:var(--accent); border-color:var(--accent); font-weight:600; }
  .cliptext { color:var(--text); font-size:15px; white-space:pre-wrap; word-break:break-all;
         display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .viewer { position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; flex-direction:column;
         align-items:center; justify-content:center; padding:20px; z-index:10; }
  .viewer.on { display:flex; }
  .viewer img { max-width:100%; max-height:75vh; border-radius:8px; -webkit-touch-callout:default; }
  .viewer p { color:#fff; font-size:16px; margin:16px 0 10px; text-align:center; }
  .viewer button { background:#fff; color:#111; border:0; border-radius:10px; padding:10px 22px; font-size:15px; }
  .empty { padding:30px; text-align:center; color:var(--muted); }
  .pc { display:none; background:var(--card); border-radius:16px; padding:16px; margin-bottom:16px; gap:18px; align-items:center; }
  .pc.on { display:flex; }
  .pc img { width:132px; height:132px; border-radius:8px; background:#fff; padding:6px; flex:none; }
  .pc .t { font-size:13px; color:var(--muted); }
  .pc .u { font-size:22px; font-weight:700; margin:4px 0 12px; word-break:break-all; user-select:all; }
  .pc .b { display:flex; gap:8px; flex-wrap:wrap; }
  .pc .b button { border:1px solid var(--line); background:transparent; color:var(--text); border-radius:10px; padding:9px 14px; font-size:14px; cursor:pointer; }
  .pc .b .q { color:var(--danger); }
  .bye { padding:80px 20px; text-align:center; color:var(--muted); font-size:17px; }
  .name, .meta { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .note button, .actions button, .actions a { white-space:nowrap; }
  .sub { color:var(--muted); font-size:14px; margin:-12px 0 18px; }
  @media (max-width:520px) {
    .pc.on { flex-direction:column; text-align:center; } .pc .b { justify-content:center; }
    li { flex-wrap:wrap; row-gap:10px; }
    .info { flex-basis:calc(100% - 54px); }
    .actions { width:100%; justify-content:flex-end; }
    .actions a, .actions button { padding:7px 14px; }
    .drop { padding:22px 14px; }
  }
</style>
</head>
<body>
<main>
  <h1>📁 파일공유</h1>
  <div class="sub">같은 Wi-Fi 기기끼리 파일·텍스트 주고받기</div>

  <div class="pc" id="pc">
    <img id="qr" alt="QR 코드">
    <div>
      <div class="t">같은 Wi-Fi의 휴대폰·태블릿·PC 브라우저에서 이 주소로 접속하거나, 카메라로 QR을 찍으세요</div>
      <div class="u" id="lan"></div>
      <div class="b">
        <button id="copy">주소 복사</button>
        <button id="folder">저장 폴더 열기</button>
        <button class="q" id="quit">프로그램 종료</button>
      </div>
    </div>
  </div>

  <div class="drop" id="drop">
    <button class="btn" id="pick">파일 올리기</button>
    <input type="file" id="file" multiple hidden>
    <p>사진, PDF, Excel, PPT 등 여러 개를 한 번에 고를 수 있어요.<br>PC에서는 여기로 끌어다 놓아도 됩니다.</p>
  </div>
  <div class="uploads" id="uploads"></div>

  <div class="note">
    <textarea id="noteText" placeholder="보낼 텍스트를 붙여넣거나 입력하세요"></textarea>
    <div class="row"><span id="noteMsg">PC에서 [복사]를 누르면 바로 붙여넣을 수 있어요</span><button id="noteSend">텍스트 보내기</button></div>
  </div>

  <div class="head">
    <h2>공유 목록 <span id="count" style="color:var(--muted);font-weight:400"></span></h2>
    <button class="link" id="refresh">새로고침</button>
  </div>
  <ul id="list"><li class="empty">불러오는 중…</li></ul>
</main>
<div class="viewer" id="viewer">
  <img id="viewerImg" alt="">
  <p>이미지를 <b>길게 누른 뒤 '복사'</b>를 누르세요</p>
  <button>닫기</button>
</div>

<script>
const $ = s => document.querySelector(s);
const COLORS = { pdf:"#e5252a", xls:"#1d7044", xlsx:"#1d7044", csv:"#1d7044", ppt:"#d24726", pptx:"#d24726",
                 doc:"#2b579a", docx:"#2b579a", hwp:"#1f8ae0", zip:"#7a5af8", txt:"#6e6e73" };
const THUMB = ["jpg","jpeg","png","gif"];              // PC가 작은 미리보기를 만들어 주는 형식
const IMG = [...THUMB, "webp","bmp","heic","heif"];   // 브라우저가 보여줄 수 있으면 미리보기

function fmtSize(b) {
  if (b < 1024) return b + " B";
  const u = ["KB","MB","GB"]; let i = -1;
  do { b /= 1024; i++; } while (b >= 1024 && i < u.length - 1);
  return b.toFixed(b < 10 ? 1 : 0) + " " + u[i];
}
function fmtDate(t) {
  const d = new Date(t * 1000), p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function esc(s) { return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

let files = [];

// http 주소에서도 동작하는 복사 (Safari는 보안 연결이 아니면 clipboard API가 없음)
function copyToClipboard(text) {
  if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text); return true; }
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly", "");
  ta.style.position = "fixed"; ta.style.top = "0"; ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  ta.remove();
  return ok;
}

let items = [], lastSig = "";

function badge(ext) {
  return `<div class="ico" style="background:${COLORS[ext] || "#8e8e93"}">${esc(ext.slice(0,4).toUpperCase() || "FILE")}</div>`;
}

async function getList(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error(url + " " + r.status);
  const v = await r.json();
  return Array.isArray(v) ? v : [];
}

async function load() {
  try { await render(); }
  catch (e) {
    lastSig = "";
    $("#list").innerHTML = '<li class="empty">목록을 불러오지 못했어요. PC에서 파일공유가 실행 중인지 확인하세요.</li>';
  }
}

async function render() {
  const [fl, cl] = await Promise.all([getList("/api/files"), getList("/api/clips")]);
  const fileList = fl.map(f => ({ ...f, kind: "file" }));
  const clipList = cl.map(c => ({ ...c, kind: "clip", mtime: c.time }));
  items = [...clipList, ...fileList].sort((a, b) => b.mtime - a.mtime);
  const sig = JSON.stringify(items.map(f => [f.id || f.name, f.size, f.mtime]));
  if (sig === lastSig) return;   // 바뀐 게 없으면 다시 그리지 않음 (썸네일 깜빡임 방지)
  lastSig = sig;
  $("#count").textContent = items.length ? `(${items.length})` : "";
  if (!items.length) { $("#list").innerHTML = '<li class="empty">아직 올라온 파일이나 텍스트가 없어요.</li>'; return; }
  $("#list").innerHTML = items.map((f, i) => {
    if (f.kind === "clip") {
      return `<li><div class="ico" style="background:#7c3aed;font-size:16px">Aa</div>
        <div class="info"><div class="cliptext">${esc(f.text)}</div>
          <div class="meta">텍스트 ${[...f.text].length}자 · ${fmtDate(f.mtime)}</div></div>
        <div class="actions"><button class="copy" data-i="${i}">복사</button>
          <button class="del" data-i="${i}">삭제</button></div></li>`;
    }
    const url = "/files/" + encodeURIComponent(f.name);
    const ext = (f.name.split(".").pop() || "").toLowerCase();
    const isImg = IMG.includes(ext);
    const src = THUMB.includes(ext) ? `/api/thumb/${encodeURIComponent(f.name)}?v=${f.mtime}` : url;
    const icon = isImg
      ? `<div class="ico thumb" data-ext="${esc(ext)}"><img src="${src}" loading="lazy" alt="" onerror="this.parentNode.outerHTML=badge(this.parentNode.dataset.ext)"></div>`
      : badge(ext);
    return `<li>${icon}
      <div class="info"><a class="name" href="${url}" target="_blank">${esc(f.name)}</a>
        <div class="meta">${fmtSize(f.size)} · ${fmtDate(f.mtime)}</div></div>
      <div class="actions">${isImg ? `<button class="copy" data-i="${i}">복사</button>` : ""}<a href="${url}?dl=1" download>받기</a>
        <button class="del" data-i="${i}">삭제</button></div></li>`;
  }).join("");
}

// 이미지 복사: 보안 연결이면 바로, 아니면(일반 http) 이미지를 크게 띄워 길게 눌러 복사
function copyImage(f, btn) {
  const url = "/files/" + encodeURIComponent(f.name);
  if (window.isSecureContext && window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
    const blob = fetch(url).then(r => r.blob()).then(b => b.type === "image/png" ? b : toPNG(b));
    navigator.clipboard.write([new ClipboardItem({ "image/png": blob })])
      .then(() => flash(btn, "복사됨 ✓"), () => showViewer(url));
    return;
  }
  showViewer(url);
}
function toPNG(blob) {
  return createImageBitmap(blob).then(bm => {
    const c = document.createElement("canvas"); c.width = bm.width; c.height = bm.height;
    c.getContext("2d").drawImage(bm, 0, 0);
    return new Promise(r => c.toBlob(r, "image/png"));
  });
}
function showViewer(url) { $("#viewerImg").src = url; $("#viewer").classList.add("on"); }
function flash(btn, text) { btn.textContent = text; setTimeout(() => btn.textContent = "복사", 1500); }

function upload(file) {
  return new Promise(resolve => {
    const row = document.createElement("div");
    row.className = "up";
    row.innerHTML = `<div>${esc(file.name)} <span style="color:var(--muted)">(${fmtSize(file.size)})</span> <b class="st"></b></div><div class="bar"><div></div></div>`;
    $("#uploads").prepend(row);
    const xhr = new XMLHttpRequest();
    xhr.open("POST", "/api/upload");
    xhr.setRequestHeader("X-Filename", encodeURIComponent(file.name));
    xhr.setRequestHeader("Content-Type", "application/octet-stream");
    xhr.upload.onprogress = e => { if (e.lengthComputable) row.querySelector(".bar>div").style.width = (e.loaded / e.total * 100) + "%"; };
    xhr.onload = () => {
      const ok = xhr.status === 200;
      row.querySelector(".st").textContent = ok ? "✓ 완료" : "✗ 실패";
      if (ok) setTimeout(() => row.remove(), 2500);
      resolve();
    };
    xhr.onerror = () => { row.querySelector(".st").textContent = "✗ 실패 (연결 확인)"; resolve(); };
    xhr.send(file);
  });
}

async function uploadAll(files) {
  for (const f of files) { await upload(f); load(); }
}

$("#pick").onclick = () => $("#file").click();
$("#file").onchange = e => { uploadAll([...e.target.files]); e.target.value = ""; };
$("#refresh").onclick = () => { lastSig = ""; load(); };

const drop = $("#drop");
["dragenter","dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => uploadAll([...e.dataTransfer.files]));

$("#list").addEventListener("click", async e => {
  const c = e.target.closest(".copy");
  if (c) {
    const f = items[+c.dataset.i];
    if (f.kind === "clip") flash(c, copyToClipboard(f.text) ? "복사됨 ✓" : "복사 실패");
    else copyImage(f, c);
    return;
  }
  const b = e.target.closest(".del");
  if (!b) return;
  const f = items[+b.dataset.i];
  if (f.kind === "clip") {
    if (!confirm("이 텍스트를 삭제할까요?")) return;
    await fetch("/api/clips/" + f.id, { method: "DELETE" });
  } else {
    if (!confirm(`'${f.name}' 파일을 삭제할까요?`)) return;
    await fetch("/files/" + encodeURIComponent(f.name), { method: "DELETE" });
  }
  load();
});
$("#viewer").onclick = e => { if (e.target.tagName !== "IMG") $("#viewer").classList.remove("on"); };

$("#noteSend").onclick = async () => {
  const t = $("#noteText").value;
  if (!t.trim()) { $("#noteMsg").textContent = "보낼 텍스트를 입력하세요"; return; }
  const r = await fetch("/api/clips", { method: "POST", headers: { "Content-Type": "text/plain; charset=utf-8" }, body: t });
  if (r.ok) { $("#noteText").value = ""; $("#noteMsg").textContent = "보냈어요 ✓ PC에서 [복사]를 누르면 돼요"; load(); }
  else { $("#noteMsg").textContent = "보내지 못했어요"; }
};

load();
fetch("/api/info").then(r => r.json()).then(i => {
  if (!i.local) return;
  $("#pc").classList.add("on");
  $("#lan").textContent = i.url;
  $("#qr").src = "/api/qr.png";
});
$("#copy").onclick = async () => {
  try { await navigator.clipboard.writeText($("#lan").textContent); $("#copy").textContent = "복사됨 ✓"; }
  catch { $("#copy").textContent = "직접 선택해 복사하세요"; }
  setTimeout(() => $("#copy").textContent = "주소 복사", 2000);
};
$("#folder").onclick = () => fetch("/api/open-folder", { method: "POST" });
$("#quit").onclick = async () => {
  if (!confirm("파일공유 프로그램을 종료할까요?\n종료하면 다른 기기에서도 접속할 수 없어요.")) return;
  await fetch("/api/quit", { method: "POST" }).catch(() => {});
  clearInterval(timer);
  document.querySelector("main").innerHTML = '<div class="bye">프로그램이 종료되었습니다. 이 창은 닫아도 됩니다.<br>다시 쓰려면 파일공유.exe를 실행하세요.</div>';
};
const timer = setInterval(() => { if (!document.hidden && !$("#viewer").classList.contains("on")) load(); }, 5000);  // 다른 기기에서 올린 파일 자동 반영
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
